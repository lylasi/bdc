name: bdc-kokoro

services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu@sha256:ee3111d6a2c903ed62f3b4fa19543c6901205ed39fce3c177e895b34a8386b9c
    container_name: bdc-kokoro
    ports:
      - '127.0.0.1:8880:8880'
      - '10.10.10.5:8880:8880'
    environment:
      WEB_CONCURRENCY: '1'
      API_LOG_LEVEL: 'INFO'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:8880/health']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    cpus: 4
    mem_limit: 6g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
