<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI provider E2E (mock Worker)</title>
<style>
body{font-family:system-ui,sans-serif;padding:20px;background:#0f1720;color:#e8eef6}
h1{font-size:18px}
#results{display:grid;gap:4px;margin-top:12px;font-family:ui-monospace,monospace;font-size:12px}
.pass{color:#4ade80}.fail{color:#f87171}.info{color:#93c5fd}
button{padding:6px 12px;margin-top:8px}
</style>
</head>
<body>
<h1>AI provider E2E — mock Worker + mock provider</h1>
<p>此頁只使用假 Worker／假供應商；不接觸正式服務或真實 Key。</p>
<button id="run">Run tests</button>
<div id="results"></div>
<script>
globalThis.__BDC_SYNC_ENDPOINT__ = 'https://mock.bdc.invalid';

// ---------------------------------------------------------------------------
// Mock provider (three protocols, records request headers)
// ---------------------------------------------------------------------------
const providerCalls = [];
const realFetch = window.fetch.bind(window);
window.fetch = async function mockFetch(input, init = {}) {
    const raw = typeof input === 'string' ? input : input.url;
    const url = new URL(raw);
    if (url.hostname === 'provider.mock') {
        providerCalls.push({ path: url.pathname, headers: init.headers || {}, body: init.body || '' });
        if (url.pathname.endsWith('/models')) {
            return jsonResponse({ data: [{ id: 'm1' }, { id: 'm2' }] });
        }
        if (url.pathname.endsWith('/messages')) {
            return jsonResponse({ content: [{ type: 'text', text: 'managed-ok' }], stop_reason: 'end_turn' });
        }
        if (url.pathname.endsWith('/chat/completions')) {
            return jsonResponse({ choices: [{ message: { content: 'managed-ok' }, finish_reason: 'stop' }] });
        }
        return jsonResponse({ error: 'not found' }, 404);
    }
    if (url.hostname === 'mock.bdc.invalid') return mockWorker(url, init);
    return realFetch(input, init);
};

function jsonResponse(data, status = 200) {
    return new Response(JSON.stringify(data), {
        status,
        headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-store' }
    });
}

// ---------------------------------------------------------------------------
// Mock Worker state
// ---------------------------------------------------------------------------
const TOKENS = {
    'test-token': { user_id: 'tester', label: 'Tester', role: 'admin' },
    'user-token': { user_id: 'user2', label: 'User 2', role: 'user' }
};
const creds = new Map(); // `${userId}:${providerId}` -> row
const releases = [];
let catalogVersion = 0;
const sharedKeys = {};

function bindingFor(provider) {
    return {
        formatVersion: 1,
        format: provider.format,
        apiUrl: provider.apiUrl,
        modelsUrl: provider.modelsUrl,
        authMode: provider.authMode
    };
}

function seedCatalog() {
    catalogVersion = 1;
    const provider = {
        id: 'managed-test',
        name: 'Managed Test',
        enabled: true,
        order: 0,
        format: 'openai-chat',
        apiUrl: 'https://provider.mock/v1/chat/completions',
        modelsUrl: 'https://provider.mock/v1/models',
        authMode: 'bearer',
        models: [{ id: 'm1', label: 'm1' }, { id: 'm2', label: 'm2' }]
    };
    sharedKeys['managed-test'] = 'shared-key';
    releases.push({
        version: 1,
        config: { schemaVersion: 1, providers: [provider], tasks: { assistant: { providerId: 'managed-test', model: 'm1' } } },
        publishedBy: 'tester',
        publishedAt: new Date().toISOString()
    });
}

async function mockWorker(url, init) {
    const path = url.pathname;
    const headers = init.headers || {};
    const token = String(headers.Authorization || '').replace(/^Bearer\s+/i, '');
    const user = TOKENS[token];
    const body = init.body ? JSON.parse(init.body) : {};
    if (!user) return jsonResponse({ error: 'unauthorized', code: 'unauthorized' }, 401);
    const userId = user.user_id;

    if (path === '/me') {
        return jsonResponse({ user_id: userId, label: user.label, role: user.role });
    }
    if (path === '/ai-catalog') {
        const release = releases[releases.length - 1] || null;
        if (!release) return jsonResponse({ version: 0, providers: [], tasks: {} });
        return jsonResponse({
            version: release.version,
            providers: release.config.providers.filter((p) => p.enabled !== false).map((p) => ({
                ...p,
                capabilities: {}
            })),
            tasks: release.config.tasks,
            publishedAt: release.publishedAt,
            expiresAt: new Date(Date.now() + 60 * 60 * 1000).toISOString()
        });
    }
    const keyMatch = path.match(/^\/ai-catalog\/providers\/([^/]+)\/credential$/);
    if (keyMatch) {
        const providerId = decodeURIComponent(keyMatch[1]);
        const requested = Number(url.searchParams.get('catalogVersion'));
        if (requested !== catalogVersion) {
            return jsonResponse({ error: 'catalog_version_conflict', code: 'catalog_version_conflict', version: catalogVersion }, 409);
        }
        const provider = releases[releases.length - 1].config.providers.find((p) => p.id === providerId);
        if (!provider) return jsonResponse({ error: 'provider_unavailable', code: 'provider_unavailable' }, 404);
        return jsonResponse({
            providerId,
            catalogVersion,
            credentialRevision: 1,
            binding: bindingFor(provider),
            apiKey: sharedKeys[providerId] || null
        });
    }
    if (path === '/ai-credentials' && (!init.method || init.method === 'GET')) {
        const items = [...creds.values()].filter((row) => row.user_id === userId).map((row) => ({
            providerId: row.provider_id,
            version: row.version,
            deleted: row.deleted,
            binding: row.binding,
            updatedAt: row.updated_at,
            lastMutationId: row.last_mutation_id
        }));
        return jsonResponse({ items });
    }
    const credMatch = path.match(/^\/ai-credentials\/([^/]+)$/);
    if (credMatch) {
        const providerId = decodeURIComponent(credMatch[1]);
        const key = `${userId}:${providerId}`;
        const row = creds.get(key);
        if (!init.method || init.method === 'GET') {
            if (!row) return jsonResponse({ error: 'credential_not_found', code: 'credential_not_found' }, 404);
            return jsonResponse({
                providerId,
                version: row.version,
                deleted: row.deleted,
                binding: row.binding,
                apiKey: row.deleted ? null : row.api_key,
                lastMutationId: row.last_mutation_id,
                updatedAt: row.updated_at
            });
        }
        if (init.method === 'PUT') {
            if (body.expectedVersion !== (row ? row.version : 0)) {
                return jsonResponse({ error: 'version_conflict', code: 'version_conflict', version: row ? row.version : 0 }, 409);
            }
            const version = (row ? row.version : 0) + 1;
            creds.set(key, {
                user_id: userId,
                provider_id: providerId,
                api_key: body.apiKey,
                binding: body.binding,
                version,
                deleted: false,
                last_mutation_id: body.mutationId,
                updated_at: new Date().toISOString()
            });
            return jsonResponse({ providerId, version, deleted: false, lastMutationId: body.mutationId });
        }
        if (init.method === 'DELETE') {
            if (!row) return jsonResponse({ error: 'credential_not_found', code: 'credential_not_found' }, 404);
            if (body.expectedVersion !== row.version) {
                return jsonResponse({ error: 'version_conflict', code: 'version_conflict', version: row.version }, 409);
            }
            const version = row.version + 1;
            creds.set(key, { ...row, api_key: null, deleted: true, version, last_mutation_id: body.mutationId });
            return jsonResponse({ providerId, version, deleted: true, lastMutationId: body.mutationId });
        }
    }
    if (path === '/admin/ai-catalog') {
        if (user.role !== 'admin') return jsonResponse({ error: 'admin_required', code: 'admin_required' }, 403);
        const release = releases[releases.length - 1];
        return jsonResponse({
            version: release.version,
            config: release.config,
            credentials: Object.fromEntries(Object.keys(sharedKeys).map((id) => [id, { hasKey: true, credentialRevision: 1, binding: bindingFor(release.config.providers.find((p) => p.id === id)) }])),
            publishedBy: release.publishedBy,
            publishedAt: release.publishedAt
        });
    }
    if (path === '/admin/ai-catalog/history') {
        return jsonResponse({ items: releases.map((r) => ({ version: r.version, config: r.config, publishedBy: r.publishedBy, publishedAt: r.publishedAt })) });
    }
    if (path === '/admin/ai-catalog/publish') {
        if (user.role !== 'admin') return jsonResponse({ error: 'admin_required', code: 'admin_required' }, 403);
        if (body.baseVersion !== catalogVersion) {
            return jsonResponse({ error: 'catalog_version_conflict', code: 'catalog_version_conflict', version: catalogVersion }, 409);
        }
        catalogVersion += 1;
        for (const [providerId, op] of Object.entries(body.keyOps || {})) {
            if (op.action === 'replace') sharedKeys[providerId] = op.apiKey;
            if (op.action === 'clear') delete sharedKeys[providerId];
        }
        releases.push({
            version: catalogVersion,
            config: body.config,
            publishedBy: userId,
            publishedAt: new Date().toISOString()
        });
        return jsonResponse({ version: catalogVersion, publishedAt: new Date().toISOString(), idempotent: false });
    }
    return jsonResponse({ error: 'not_found', code: 'not_found' }, 404);
}

// Allow tests to simulate another device modifying the cloud row.
globalThis.__bumpRemote = (providerId, apiKey) => {
    const key = `tester:${providerId}`;
    const row = creds.get(key);
    if (!row) return false;
    creds.set(key, { ...row, api_key: apiKey, version: row.version + 1, last_mutation_id: 'remote-device-' + Date.now() });
    return creds.get(key).version;
};
globalThis.__releases = releases;
globalThis.__setCatalogVersion = (value) => { catalogVersion = value; };
globalThis.__providerCalls = providerCalls;
globalThis.__sharedKeys = sharedKeys;
</script>
<script type="module">
const results = [];
const out = document.getElementById('results');
function record(name, ok, detail = '') {
    results.push({ name, ok, detail });
    const line = document.createElement('div');
    line.className = ok ? 'pass' : 'fail';
    line.textContent = `${ok ? 'PASS' : 'FAIL'} · ${name}${detail ? ' · ' + detail : ''}`;
    out.appendChild(line);
}
function info(text) {
    const line = document.createElement('div');
    line.className = 'info';
    line.textContent = text;
    out.appendChild(line);
}
async function check(name, fn) {
    try {
        const detail = await fn();
        record(name, true, typeof detail === 'string' ? detail : '');
    } catch (error) {
        record(name, false, `${error && error.code ? error.code + ' ' : ''}${error && error.message ? error.message : error}`);
    }
}
function assert(condition, message) {
    if (!condition) throw new Error(message || 'assertion failed');
}
function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
function storageContains(text) {
    for (let i = 0; i < localStorage.length; i += 1) {
        const key = localStorage.key(i);
        if (String(localStorage.getItem(key) || '').includes(text)) return key;
    }
    return '';
}

globalThis.runAITests = async function runAITests() {
    out.innerHTML = '';
    results.length = 0;
    localStorage.clear();
    releases.length = 0;
    creds.clear();
    for (const key of Object.keys(sharedKeys)) delete sharedKeys[key];
    seedCatalog();

    const auth = (await import('/modules/sync-cloudflare.js')).auth;
    const authMod = await import('/modules/sync-cloudflare.js');
    const catalog = await import('/modules/ai-catalog.js');
    const profileMod = await import('/modules/ai-profile-storage.js');
    const syncMod = await import('/modules/ai-credential-sync.js');
    syncMod.initAICredentialSync();
    const models = await import('/modules/ai-models.js');
    const api = await import('/modules/api.js');

    await check('anonymous cannot use managed providers', async () => {
        await catalog.refreshAICatalog({ force: true });
        assert(!catalog.isManagedUsable(), 'catalog should be locked');
        assert(catalog.getCatalogState().status === 'unauthenticated', `unexpected status ${catalog.getCatalogState().status}`);
    });

    await check('login verifies and loads the managed catalog', async () => {
        await auth.signInWithToken('test-token');
        await catalog.refreshAICatalog({ force: true });
        const state = catalog.getCatalogState();
        assert(state.status === 'verified', `status ${state.status} ${state.error || ''}`);
        assert(state.version === 1, `version ${state.version}`);
        assert(state.providers.some((p) => p.id === 'managed-test'), 'managed provider missing');
        assert(state.role === 'admin', 'role not loaded');
        await sleep(50);
    });

    await check('shared key is memory-only and bound to the request', async () => {
        const before = globalThis.__providerCalls.length;
        const result = await api.requestAI({ taskType: 'assistant', messages: [{ role: 'user', content: 'hi' }] });
        assert(result.text === 'managed-ok', `text ${result.text}`);
        const calls = globalThis.__providerCalls.slice(before);
        const authHeader = calls[0] && calls[0].headers.Authorization;
        assert(authHeader === 'Bearer shared-key', `auth header ${authHeader}`);
        assert(!storageContains('shared-key'), 'shared key leaked into localStorage');
        assert(!document.cookie.includes('shared-key'), 'shared key leaked into cookies');
    });

    await check('catalog refresh drops old shared keys after a version change', async () => {
        const release = globalThis.__releases[globalThis.__releases.length - 1];
        const provider = release.config.providers[0];
        globalThis.__releases.push({
            version: 2,
            config: { ...release.config, providers: [{ ...provider, models: [{ id: 'm1' }] }] },
            publishedBy: 'tester',
            publishedAt: new Date().toISOString()
        });
        globalThis.__setCatalogVersion(2);
        // The mock Worker keeps its own version; update through the shared key table.
        globalThis.__sharedKeys['managed-test'] = 'shared-key-v2';
        await catalog.refreshAICatalog({ force: true });
        const credential = await catalog.getManagedCredential('managed-test', { force: true });
        assert(credential.apiKey === 'shared-key-v2', `key ${credential.apiKey}`);
        assert(!storageContains('shared-key-v2'), 'new shared key leaked into localStorage');
    });

    await check('personal cloud key uploads, conflicts and resolves locally', async () => {
        const provider = {
            label: 'Cloud',
            enabled: true,
            format: 'openai-chat',
            baseUrl: 'https://provider.mock/v1',
            apiUrl: 'https://provider.mock/v1/chat/completions',
            modelsUrl: 'https://provider.mock/v1/models',
            authMode: 'bearer',
            allowedModels: ['m1'],
            discoveredModels: [{ id: 'm1' }],
            lastDiscoveryAt: new Date().toISOString(),
            discoveryStatus: 'success'
        };
        await syncMod.savePersonalProvider({
            providerId: 'personal-cloud',
            provider,
            apiKey: 'cloud-key-1',
            keyChanged: true,
            syncMode: 'cloud'
        });
        await syncMod.syncCredentials({ reason: 'test' });
        let status = syncMod.getProviderKeyStatus('personal-cloud');
        assert(status.version === 1, `version ${status.version}`);
        assert(!status.pending, 'pending not cleared');

        const remoteVersion = globalThis.__bumpRemote('personal-cloud', 'remote-key');
        assert(remoteVersion === 2, `remote version ${remoteVersion}`);
        await syncMod.savePersonalProvider({
            providerId: 'personal-cloud',
            provider: { ...provider, label: 'Cloud 2' },
            apiKey: 'local-key-2',
            keyChanged: true,
            syncMode: 'cloud'
        });
        await syncMod.syncCredentials({ reason: 'test' });
        status = syncMod.getProviderKeyStatus('personal-cloud');
        assert(status.conflict, 'conflict not detected');
        assert(status.conflict.remoteVersion === 2, `conflict remote ${status.conflict.remoteVersion}`);

        await syncMod.resolveCredentialConflict('personal-cloud', 'local');
        await sleep(900);
        await syncMod.syncCredentials({ reason: 'test' });
        status = syncMod.getProviderKeyStatus('personal-cloud');
        assert(!status.conflict, 'conflict not cleared');
        assert(status.version === 3, `resolved version ${status.version}`);
        assert(!storageContains('shared-key'), 'shared key leak');
    });

    await check('401 invalidation keeps personal keys but clears shared access', async () => {
        const accountScope = { endpoint: 'https://mock.bdc.invalid', userId: 'tester' };
        const before = Object.keys(profileMod.loadAIProfile(accountScope).providers).length;
        assert(before >= 1, 'expected a personal provider');
        localStorage.setItem('sync_token', 'invalid-token');
        await catalog.refreshAICatalog({ force: true });
        await sleep(150);
        assert(!authMod.getAuthSnapshot().loggedIn, 'invalid token was not cleared');
        assert(!catalog.isManagedUsable(), 'managed catalog still usable');
        assert(Object.keys(profileMod.loadAIProfile(accountScope).providers).length === before, 'personal providers were removed on 401');
        assert(Object.keys(profileMod.loadAIProfile().providers).length === before, 'active scope lost personal providers after 401');
        await auth.signInWithToken('test-token');
        await catalog.refreshAICatalog({ force: true });
    });

    await check('explicit import copies device providers and can sync the key', async () => {
        const guestScope = { endpoint: 'https://mock.bdc.invalid', userId: '', guest: true, key: 'bdc_ai_profile_v1:device:guest' };
        profileMod.saveAIProfile({
            schemaVersion: 1,
            providers: {
                'personal-device': {
                    label: 'Device', enabled: true, format: 'openai-chat',
                    baseUrl: 'https://provider.mock/v1',
                    apiUrl: 'https://provider.mock/v1/chat/completions',
                    modelsUrl: 'https://provider.mock/v1/models',
                    authMode: 'bearer', allowedModels: ['m1'], discoveredModels: [{ id: 'm1' }]
                }
            },
            credentials: {
                'personal-device': {
                    apiKey: 'device-key',
                    binding: { formatVersion: 1, format: 'openai-chat', apiUrl: 'https://provider.mock/v1/chat/completions', modelsUrl: 'https://provider.mock/v1/models', authMode: 'bearer' },
                    version: 0, syncMode: 'local-only'
                }
            }
        }, guestScope);
        const result = profileMod.importGuestProviders(['personal-device'], { syncKeys: true });
        assert(result.imported === 1, `imported ${result.imported}`);
        const account = profileMod.loadAIProfile();
        assert(account.providers['personal-device'], 'provider not imported');
        assert(account.credentials['personal-device'].syncMode === 'cloud', 'key sync not requested');
        await syncMod.syncCredentials({ reason: 'import-test' });
        const row = [...creds.values()].find((item) => item.user_id === 'tester' && item.provider_id === 'personal-device');
        assert(row && row.api_key === 'device-key' && row.version === 1, 'imported key not uploaded');
        // The device copy remains available for signed-out use.
        assert(profileMod.loadAIProfile(guestScope).providers['personal-device'], 'device copy removed');
    });

    await check('explicit logout clears account keys, catalog and metadata', async () => {
        await auth.signOut();
        await sleep(100);
        assert(!authMod.getAuthSnapshot().loggedIn, 'still logged in');
        assert(!catalog.isManagedUsable(), 'managed still usable');
        assert(!localStorage.getItem('bdc_ai_catalog_meta_v1:' + encodeURIComponent('https://mock.bdc.invalid')), 'catalog meta not cleared');
        const accountProfile = profileMod.loadAIProfile({ endpoint: 'https://mock.bdc.invalid', userId: 'tester' });
        assert(Object.keys(accountProfile.providers).length === 0, 'account profile not cleared');
        assert(Object.keys(accountProfile.credentials).length === 0, 'account credentials not cleared');
        const guestProfile = profileMod.loadAIProfile();
        assert(guestProfile.providers['personal-device'], 'device copy should remain after logout');
        try {
            await api.requestAI({ taskType: 'assistant', messages: [{ role: 'user', content: 'hi' }] });
            throw new Error('managed request should fail after logout');
        } catch (error) {
            assert(error.code === 'managed_login_required' || error.code === 'model_provider_missing' || error.code === 'model_not_selected' || error.code === 'ai_key_missing', `unexpected error ${error.code}`);
        }
    });

    await check('admin panel opens and publishes a new release', async () => {
        await auth.signInWithToken('test-token');
        const admin = await import('/features/ai-admin/ai-admin.js');
        admin.openAiAdminPanel();
        await sleep(500);
        const overlay = document.querySelector('.ai-admin-overlay');
        assert(overlay, 'admin overlay missing');
        const text = overlay.innerText;
        assert(text.includes('当前版本'), 'admin version not rendered');
        const before = globalThis.__releases.map((r) => r.version);
        const publish = overlay.querySelector('[data-admin-publish]');
        assert(publish, 'publish button missing');
        publish.click();
        await sleep(900);
        const versions = globalThis.__releases.map((r) => r.version);
        const expected = Math.max(...before) + 1;
        assert(versions.includes(expected), `no new release: ${versions.join(',')} (expected ${expected})`);
        assert(overlay.innerText.includes('已发布'), 'publish notice missing');
        admin.destroyAiAdminPanel();
    });

    await check('admin can import a legacy provider JSON export', async () => {
        const admin = await import('/features/ai-admin/ai-admin.js');
        admin.openAiAdminPanel();
        await sleep(400);
        const overlay = document.querySelector('.ai-admin-overlay');
        assert(overlay, 'admin overlay missing');
        const input = overlay.querySelector('[data-admin-import-file]');
        assert(input, 'import input missing');
        const payload = {
            providers: [{ sourceId: 'legacy', label: 'Legacy', format: 'openai-chat', baseUrl: 'https://legacy.example/v1', apiKey: 'legacy-key', allowedModels: ['legacy-model'] }],
            tasks: { assistant: 'legacy:legacy-model' }
        };
        const file = new File([JSON.stringify(payload)], 'legacy.json', { type: 'application/json' });
        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;
        input.dispatchEvent(new Event('change', { bubbles: true }));
        await sleep(400);
        assert(overlay.innerText.includes('已导入'), 'import notice missing');
        assert(overlay.innerText.includes('Legacy'), 'imported provider missing');
        admin.destroyAiAdminPanel();
    });

    await check('legacy AI settings migrate once into the device profile', async () => {
        localStorage.clear();
        localStorage.setItem('pen_global_settings', JSON.stringify({
            ai: {
                apiUrl: 'https://legacy.example/v1/chat/completions',
                providers: {
                    default: { apiUrl: 'https://legacy.example/v1/chat/completions' },
                    mine: { baseUrl: 'https://legacy.example/v1', enabled: true }
                }
            },
            tts: { use: 'remote' }
        }));
        localStorage.setItem('pen_global_secrets', JSON.stringify({
            aiProviders: { default: { apiKey: 'static-key' }, mine: { apiKey: 'mine-key' } },
            aiApiKey: 'static-key',
            ttsApiKey: 'tts-key'
        }));
        const migration = profileMod.migrateLegacyAISettings();
        assert(migration.migrated, 'migration did not run');
        const guest = profileMod.loadAIProfile({ endpoint: '', userId: '', guest: true, key: 'bdc_ai_profile_v1:device:guest' });
        assert(guest.providers.mine, 'legacy personal provider missing');
        assert(guest.providers.mine.enabled === false, 'migrated provider should start disabled');
        assert(guest.credentials.mine.apiKey === 'mine-key', 'legacy personal key missing');
        assert(guest.credentials.mine.syncMode === 'local-only', 'legacy key should be local-only');
        assert(!guest.providers.default, 'legacy default must not become a personal provider');
        const secrets = JSON.parse(localStorage.getItem('pen_global_secrets'));
        assert(!secrets.aiProviders && !secrets.aiApiKey, 'legacy AI secrets not removed');
        assert(secrets.ttsApiKey === 'tts-key', 'TTS secret must be preserved');
        const again = profileMod.migrateLegacyAISettings();
        assert(again.migrated === false && again.reason === 'already-migrated', 'migration not idempotent');
    });

    await check('missing provider/key does not borrow another provider', async () => {
        localStorage.clear();
        const guestScope = { endpoint: '', userId: '', guest: true, key: 'bdc_ai_profile_v1:device:guest' };
        profileMod.saveAIProfile({
            schemaVersion: 1,
            providers: {
                'personal-a': {
                    label: 'A', enabled: true, format: 'openai-chat',
                    baseUrl: 'https://a.example/v1',
                    apiUrl: 'https://a.example/v1/chat/completions',
                    modelsUrl: 'https://a.example/v1/models',
                    authMode: 'bearer', allowedModels: ['m1'], discoveredModels: []
                },
                'personal-b': {
                    label: 'B', enabled: true, format: 'openai-chat',
                    baseUrl: 'https://b.example/v1',
                    apiUrl: 'https://b.example/v1/chat/completions',
                    modelsUrl: 'https://b.example/v1/models',
                    authMode: 'bearer', allowedModels: ['m2'], discoveredModels: []
                }
            },
            credentials: {
                'personal-a': {
                    apiKey: 'key-a',
                    binding: { formatVersion: 1, format: 'openai-chat', apiUrl: 'https://a.example/v1/chat/completions', modelsUrl: 'https://a.example/v1/models', authMode: 'bearer' },
                    version: 1, syncMode: 'local-only'
                }
            },
            taskModels: { assistant: 'personal-b:m2' }
        }, guestScope);
        try {
            await api.requestAI({ taskType: 'assistant', messages: [{ role: 'user', content: 'hi' }] });
            throw new Error('request should fail');
        } catch (error) {
            assert(error.code === 'ai_key_missing', `unexpected error ${error.code}`);
        }
    });

    const passed = results.filter((r) => r.ok).length;
    info(`done: ${passed}/${results.length} passed`);
    return { passed, total: results.length, results };
};

document.getElementById('run').addEventListener('click', () => {
    globalThis.__lastRun = globalThis.runAITests();
});
</script>
