<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-labelledby="n-title n-desc">
  <title id="n-title">齿龈鼻音 /n/ 发音侧面解剖示意图</title>
  <desc id="n-desc">侧面矢状面解剖示意：发齿龈鼻音 /n/ 时，舌尖紧抵上门牙后方的齿龈形成完全闭塞，软腭下垂开放鼻咽通路，口腔完全受阻无气流流出，声带振动的气流全部经由鼻腔通畅排出。</desc>
  <defs>
    <marker id="arrow-n" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <linearGradient id="palateGrad-n" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EEE1" />
    </linearGradient>
    <linearGradient id="tongueGrad-n" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
  </defs>

  <!-- 背景底卡 -->
  <rect width="400" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 主发音示意结构 (局部矢状面，脸朝右) -->
  <g class="diagram-figure" transform="translate(28, 18)">
    <!-- 鼻腔内部空腔通气底色 (展示通畅鼻腔通路) -->
    <path d="M 90 76 L 90 44 Q 160 38 238 46 Q 256 58 260 74 Q 266 84 256 90 L 244 90 L 226 84 L 142 66 Q 112 70 90 76 Z" fill="#EFF6FF" stroke="none" />

    <!-- 后脑、额鼻与面部外轮廓 (清晰勾勒鼻部与外鼻孔) -->
    <path d="M 78 215 L 75 160 Q 75 105 115 48 Q 175 28 238 46 Q 256 58 260 74 Q 266 84 256 90 L 254 90 M 246 90 L 244 90 Q 258 106 268 114 Q 256 122 240 122" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 240 134 Q 256 140 252 146 Q 242 154 248 174 Q 234 195 226 215" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />

    <!-- 咽后壁解剖组织带 (向上贯通咽部与鼻咽部) -->
    <path d="M 78 215 L 78 44 L 90 44 L 90 215 Z" fill="#F8F1E7" stroke="#E2D1BE" stroke-width="1.2" />

    <!-- 硬腭组织体 (前方骨质穹顶) -->
    <path d="M 142 66 Q 175 72 214 96 L 222 102 L 226 84 Q 180 64 142 66 Z" fill="url(#palateGrad-n)" stroke="#D4BFA4" stroke-width="1.4" stroke-linejoin="round" />
    <path d="M 142 66 Q 175 72 214 96" fill="none" stroke="#B89F82" stroke-width="1.8" stroke-linecap="round" />

    <!-- 软腭下垂体 (软腭降低远离咽后壁，鼻咽通道完全开放) -->
    <path d="M 142 66 Q 134 84 124 104 Q 118 114 114 112 Q 112 106 116 94 Q 124 78 142 66 Z" fill="url(#palateGrad-n)" stroke="#C27D88" stroke-width="1.6" stroke-linejoin="round" />
    <!-- 软腭肌肉轮廓线 -->
    <path d="M 142 66 Q 134 84 122 108" fill="none" stroke="#C27D88" stroke-width="2" stroke-linecap="round" />

    <!-- 喉咽/气管入口底端截断 -->
    <line x1="90" y1="215" x2="118" y2="215" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="104" y="223" font-size="7" fill="#64748B" text-anchor="middle">来自气管</text>

    <!-- 上门牙 -->
    <rect x="220" y="100" width="7.5" height="16" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />
    <!-- 下门牙 -->
    <rect x="219" y="136" width="7.5" height="15" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />

    <!-- 舌体 (粉色肌肉实体：舌尖完全顶住上齿龈，形成接触闭塞，气流绝无法从口中漏出) -->
    <path d="M 124 215 Q 128 175 136 150 Q 146 128 165 116 Q 185 106 208 94 L 222 96 L 222 116 Q 206 128 186 144 Q 166 164 158 215 Z" fill="url(#tongueGrad-n)" stroke="#E11D48" stroke-width="1.8" stroke-linejoin="round" />
    <!-- 舌面高光弧线 -->
    <path d="M 152 120 Q 175 110 198 102" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- 齿龈接触接触闭塞标记 (橘红色实心接触弧) -->
    <path d="M 210 94 Q 216 95 222 96" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round" />

    <!-- 内部气流走向 (从咽腔顺畅向上走入鼻腔，解剖合理) -->
    <path d="M 104 180 Q 104 100 112 78 Q 122 56 160 52 Q 200 48 240 75 Q 248 82 250 90" fill="none" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="4 3" opacity="0.85" />

    <!-- 鼻孔呼气出口方向箭头 (蓝色箭头自鼻孔向外，无口出气箭头！) -->
    <path d="M 250 90 Q 266 100 282 100" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrow-n)" />
  </g>

  <!-- 左上角：正面唇形小图标 -->
  <g class="lip-inset" transform="translate(14, 14)">
    <rect width="84" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="42" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">正面唇形</text>
    <ellipse cx="42" cy="34" rx="20" ry="6" fill="#FF8A9E" stroke="#E11D48" stroke-width="1.2" />
    <ellipse cx="42" cy="34" rx="14" ry="2.5" fill="#FFFFFF" stroke="#BE6476" stroke-width="0.8" />
    <text x="42" y="52" text-anchor="middle" font-size="8" fill="#64748B">双唇微启 · 气走鼻腔</text>
  </g>

  <!-- 朝向提示 -->
  <g class="orientation-badge">
    <rect x="14" y="80" width="102" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="65" y="93.5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#475569">嘴巴侧面 · 脸朝右</text>
  </g>

  <!-- 顶部特性标签 -->
  <rect x="136" y="14" width="166" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
  <text x="219" y="25" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#3730A3">n · 齿龈鼻音 (软腭降低)</text>

  <!-- 器官与气流标注 -->
  <g class="organ-labels" font-family="system-ui, -apple-system, sans-serif">
    <!-- 鼻腔通路 (指向开放通畅的鼻腔内部：x=170, y=52) -->
    <path d="M 128 40 L 158 61 L 190 69" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="190" cy="69" r="2.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="100" y="22" width="56" height="18" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" />
    <text x="128" y="31" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#1D4ED8">鼻腔通路</text>

    <!-- 软腭降低 (指向下垂的软腭组织：x=144, y=110) -->
    <path d="M 80 110 L 142 110" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="144" cy="110" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="101" width="56" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="52" y="110" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">软腭降低</text>

    <!-- 齿龈闭塞 (橙色引线指向舌尖抵住齿龈的闭塞处：x=238, y=112) -->
    <path d="M 326 95 L 285 95 L 244 112" fill="none" stroke="#EA580C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="242" cy="112" r="2.2" fill="#EA580C" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="326" y="86" width="56" height="18" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" />
    <text x="354" y="95" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#C2410C">齿龈闭塞</text>

    <!-- 鼻孔呼气 (蓝色引线指向鼻孔呼气箭头：x=290, y=94) -->
    <path d="M 326 125 L 305 125 L 292 117" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="292" cy="117" r="2.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="326" y="116" width="56" height="18" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" />
    <text x="354" y="125" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#1D4ED8">鼻腔呼气</text>

    <!-- 舌头 (指向舌体中心：x=193, y=163) -->
    <path d="M 60 216 L 124 216 L 191 165" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="193" cy="163" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="207" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">舌头</text>

    <!-- 咽部气道 (x=125, y=168) -->
    <path d="M 60 168 L 123 168" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="125" cy="168" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="159" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="168" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">咽部</text>

    <!-- 口腔无出气说明标签 -->
    <rect x="316" y="150" width="72" height="18" rx="4" fill="#FEF2F2" stroke="#FECACA" stroke-width="0.8" />
    <text x="352" y="159" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#DC2626">口腔完全阻断</text>
  </g>

  <!-- 发音口诀 -->
  <text x="200" y="260" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">舌尖轻贴齿龈 · 软腭降低 · 气流经鼻腔流出</text>

  <!-- 底部说明 -->
  <text x="200" y="284" text-anchor="middle" font-size="8.5" fill="#94A3B8">动作草图 · 鼻咽通道开放 · 齿龈闭塞阻断口腔出气 · 待专业审核</text>
</svg>
