<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-labelledby="s-title s-desc">
  <title id="s-title">齿龈摩擦音 /s/ 发音侧面解剖示意图</title>
  <desc id="s-desc">侧面矢状面解剖示意：发齿龈摩擦音 /s/ 时，上下门牙靠拢，舌尖或舌叶靠近上门牙后面的齿龈留出极窄细缝，软腭抬起闭合鼻腔，气流经细缝高速挤过产生清脆摩擦，口外蓝箭头指示呼气方向。</desc>
  <defs>
    <marker id="arrow-s" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <linearGradient id="palateGrad-s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EEE1" />
    </linearGradient>
    <linearGradient id="tongueGrad-s" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
  </defs>

  <!-- 背景底卡 -->
  <rect width="400" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 主发音示意结构 (局部矢状面，脸朝右) -->
  <g class="diagram-figure" transform="translate(28, 18)">
    <!-- 后脑与面部外轮廓 -->
    <path d="M 78 215 L 75 160 Q 75 105 115 48 Q 175 28 228 38 Q 252 58 260 74 Q 274 88 262 98 Q 260 106 268 114 Q 256 122 240 120" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 240 126 Q 256 130 252 136 Q 242 148 248 174 Q 234 195 226 215" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />

    <!-- 咽后壁解剖组织带 -->
    <path d="M 78 215 L 78 84 L 90 84 L 90 215 Z" fill="#F8F1E7" stroke="#E2D1BE" stroke-width="1.2" />

    <!-- 软腭与硬腭组织体 (浅米色解剖基底，软腭抬起紧贴咽后壁封闭鼻咽) -->
    <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80 Q 175 74 214 96 L 222 102 L 226 95 Q 180 66 142 70 Q 110 73 90 75 Z" fill="url(#palateGrad-s)" stroke="#D4BFA4" stroke-width="1.4" stroke-linejoin="round" />

    <!-- 硬腭表面轮廓线 -->
    <path d="M 142 80 Q 175 74 214 96" fill="none" stroke="#B89F82" stroke-width="1.8" stroke-linecap="round" />
    <!-- 软腭肌肉轮廓线 (抬起闭合) -->
    <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80" fill="none" stroke="#C27D88" stroke-width="1.8" stroke-linecap="round" />
    <line x1="142" y1="70" x2="142" y2="80" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />

    <!-- 鼻咽截断提示线 -->
    <path d="M 90 75 L 142 70 L 226 95" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="133" y="63" font-size="7" fill="#94A3B8" text-anchor="middle">鼻咽闭合 · 示意截断</text>

    <!-- 喉咽/气管入口底端截断 -->
    <line x1="90" y1="215" x2="118" y2="215" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="104" y="223" font-size="7" fill="#64748B" text-anchor="middle">来自气管</text>

    <!-- 上门牙 (门牙紧靠) -->
    <rect x="220" y="100" width="7.5" height="15" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />
    <!-- 下门牙 (上下齿几乎靠拢，留出极窄缝隙) -->
    <rect x="219" y="119" width="7.5" height="14" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />

    <!-- 舌体 (粉色肌肉实体：舌尖/舌叶抬高靠近齿龈留极窄缝隙，舌身平顺，无自交) -->
    <path d="M 122 215 Q 126 170 134 145 Q 146 125 168 114 Q 188 112 208 104 L 214 106 L 214 116 Q 202 126 184 144 Q 164 165 156 215 Z" fill="url(#tongueGrad-s)" stroke="#E11D48" stroke-width="1.8" stroke-linejoin="round" />
    <!-- 舌面高光弧线 -->
    <path d="M 158 124 Q 177 117 196 111" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- 局部齿龈极窄狭缝摩擦标记 (橙色加粗摩擦线，标注摩擦发生部位) -->
    <path d="M 210 100 Q 215 101 220 103" fill="none" stroke="#EA580C" stroke-width="2.6" stroke-linecap="round" />

    <!-- 呼气方向箭头 (口外指示呼气出口方向，蓝色箭头，不穿牙穿腭) -->
    <path d="M 270 122 L 296 122" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrow-s)" />
  </g>

  <!-- 左上角：正面唇形小图标 -->
  <g class="lip-inset" transform="translate(14, 14)">
    <rect width="84" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="42" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">正面唇形</text>
    <!-- 双唇扁展露出上下齿缝 -->
    <path d="M 22 35 Q 32 30 42 30 Q 52 30 62 35 Q 52 40 42 40 Q 32 40 22 35 Z" fill="#FF8A9E" stroke="#E11D48" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 26 35 Q 34 31 42 31 Q 50 31 58 35 Q 50 39 42 39 Q 34 39 26 35 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <line x1="28" y1="35" x2="56" y2="35" stroke="#94A3B8" stroke-width="0.8" />
    <text x="42" y="52" text-anchor="middle" font-size="8" fill="#64748B">嘴角微展 · 门牙微缝</text>
  </g>

  <!-- 朝向提示 -->
  <g class="orientation-badge">
    <rect x="14" y="80" width="102" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="65" y="93.5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#475569">嘴巴侧面 · 脸朝右</text>
  </g>

  <!-- 顶部特性标签 -->
  <rect x="146" y="14" width="154" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
  <text x="223" y="25" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#3730A3">s · 齿龈摩擦音 (清辅音)</text>

  <!-- 器官与气流标注 -->
  <g class="organ-labels" font-family="system-ui, -apple-system, sans-serif">
    <!-- 软腭 (指向闭合软腭：x=142, y=98) -->
    <path d="M 134 66 L 134 78 L 142 98" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="142" cy="100" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="116" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="134" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">软腭</text>

    <!-- 硬腭 (指向硬腭穹顶：x=203, y=92) -->
    <path d="M 188 66 L 188 78 L 203 90" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="203" cy="92" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="170" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="188" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">硬腭</text>

    <!-- 齿龈摩擦 (橙色引线指向齿龈狭缝摩擦处：x=240, y=115) -->
    <path d="M 326 95 L 285 95 L 240 119" fill="none" stroke="#EA580C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="240" cy="119" r="2.2" fill="#EA580C" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="326" y="86" width="56" height="18" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" />
    <text x="354" y="95" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#C2410C">齿龈摩擦</text>

    <!-- 门牙靠拢 (指向上下门牙：x=248, y=128) -->
    <path d="M 334 118 L 295 118 L 250 128" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="248" cy="128" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="109" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="118" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">门牙靠拢</text>

    <!-- 呼气方向 (蓝色引线指向口外呼气箭头：x=290, y=140) -->
    <path d="M 326 140 L 305 140 L 296 140" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="326" y="131" width="56" height="18" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" />
    <text x="354" y="140" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#1D4ED8">呼气方向</text>

    <!-- 舌头 (指向舌体中心：x=193, y=163) -->
    <path d="M 60 216 L 124 216 L 191 165" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="193" cy="163" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="207" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">舌头</text>

    <!-- 咽部气道 (x=125, y=168) -->
    <path d="M 60 168 L 123 168" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="125" cy="168" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="159" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="168" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">咽部</text>
  </g>

  <!-- 发音口诀 -->
  <text x="200" y="260" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">舌尖靠近上齿龈 · 门牙靠拢擦出气 · 细流如丝</text>

  <!-- 底部说明 -->
  <text x="200" y="284" text-anchor="middle" font-size="8.5" fill="#94A3B8">动作草图 · 齿龈摩擦狭缝示意 · 橙色为狭缝摩擦 · 待专业审核</text>
</svg>
