<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-labelledby="labiodental-title labiodental-desc">
  <title id="labiodental-title">唇齿摩擦音 /f, v/ 卡通发音示意</title>
  <desc id="labiodental-desc">嘴巴侧面示意（脸朝右）：上门牙切缘轻触下唇内侧，形成极窄狭缝气流摩擦，绝不完全封死；橙色标记指示局部摩擦位置；软腭抬起闭合；舌根后方咽腔通畅至底；口外蓝色虚线箭头仅指示呼气出口方向。f 清音声带不振动，v 浊音声带振动。</desc>
  <defs>
    <marker id="arrow-labiodental" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <linearGradient id="palateGrad-labiodental" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EEE1" />
    </linearGradient>
    <linearGradient id="tongueGrad-labiodental" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
  </defs>

  <!-- 背景底卡 -->
  <rect width="400" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 主发音示意结构 (局部矢状面，脸朝右) -->
  <g class="diagram-figure" transform="translate(28, 18)">

      <!-- 后脑与面部外轮廓 (面向右，上门牙轻触下唇，口裂微开) -->
      <path d="M 78 215 L 75 160 Q 75 105 115 48 Q 175 28 228 38 Q 252 58 260 74 Q 274 88 262 98 Q 260 106 266 112 Q 256 120 240 120" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />
      <!-- 下唇向后上方轻触上门牙切缘 (x=226, y=118 处轻触) -->
      <path d="M 226 120 Q 238 122 250 126 Q 244 146 248 172 Q 234 195 226 215" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />

      <!-- 咽后壁解剖组织带 (后方封闭，腔面平顺垂直于 x=90，延伸至图底截断处) -->
      <path d="M 78 215 L 78 84 L 90 84 L 90 215 Z" fill="#F8F1E7" stroke="#E2D1BE" stroke-width="1.2" />

      <!-- 软腭与硬腭组织体 (硬腭在前、软腭在后向上抬起封闭鼻咽) -->
      <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80 Q 175 74 214 96 L 222 102 L 226 95 Q 180 66 142 70 Q 110 73 90 75 Z" fill="url(#palateGrad-labiodental)" stroke="#D4BFA4" stroke-width="1.4" stroke-linejoin="round" />

      <!-- 硬腭骨质穹顶表面轮廓线 (前上方) -->
      <path d="M 142 80 Q 175 74 214 96" fill="none" stroke="#B89F82" stroke-width="1.8" stroke-linecap="round" />
      <!-- 软腭肌肉表面轮廓线 (后上方，呈抬起闭合状态) -->
      <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80" fill="none" stroke="#C27D88" stroke-width="1.8" stroke-linecap="round" />
      <!-- 软硬腭解剖分界细标记线 -->
      <line x1="142" y1="70" x2="142" y2="80" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- 鼻腔与颅底截断提示线 -->
      <path d="M 90 75 L 142 70 L 226 95" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3" />
      <text x="133" y="63" font-size="7" fill="#94A3B8" text-anchor="middle">鼻咽闭合 · 示意截断</text>

      <!-- 喉咽/气管入口底端截断 (y=215，咽后壁90与舌根间留出宽敞气道) -->
      <line x1="90" y1="215" x2="118" y2="215" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
      <text x="104" y="223" font-size="7" fill="#64748B" text-anchor="middle">来自气管</text>

      <!-- 上门牙 (牙白，切缘下伸至 y=117) -->
      <rect x="220" y="100" width="7.5" height="17" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />
      <!-- 下门牙 (牙白，位于下唇后方内缩) -->
      <rect x="214" y="134" width="7" height="14" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />

      <!-- 舌体 (粉色肌肉实体，自然平放口底，舌根后方咽腔通气道宽敞至图底) -->
      <path d="M 122 215 Q 124 165 130 148 Q 146 142 170 140 Q 195 138 212 142 L 214 146 Q 206 156 186 164 Q 164 178 156 215 Z" fill="url(#tongueGrad-labiodental)" stroke="#E11D48" stroke-width="1.8" stroke-linejoin="round" />
      <!-- 舌面高光弧线 -->
      <path d="M 152 142 Q 178 139 204 141" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

      <!-- 局部细橙色狭缝摩擦标记 (上门牙切缘与下唇接触狭缝，局部摩擦，不可完全封死) -->
      <path d="M 224 116 Q 228 119 231 118" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />

      <!-- 蓝箭头仅在口外指示呼气出口方向，不穿牙、不穿唇 -->
      <path d="M 272 143 L 296 143" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrow-labiodental)" />

  </g>

  <!-- 左上角：正面唇形小图标 (上门牙轻咬下唇正面观) -->
  <g class="lip-inset" transform="translate(14, 14)">
    <rect width="84" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="42" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">正面唇形</text>
    <!-- 上唇轮廓 -->
    <path d="M 20 33 Q 31 27 42 28 Q 53 27 64 33 Q 53 38 42 38 Q 31 38 20 33 Z" fill="#FF8A9E" stroke="#E11D48" stroke-width="1.2" stroke-linejoin="round" />
    <!-- 白色上门牙露出 -->
    <path d="M 32 34 L 32 38.5 Q 42 39 52 38.5 L 52 34 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <line x1="42" y1="34" x2="42" y2="38.7" stroke="#CBD5E1" stroke-width="0.7" />
    <!-- 橙色细摩擦标记在牙齿与下唇交界处 -->
    <line x1="33" y1="38.5" x2="51" y2="38.5" stroke="#EA580C" stroke-width="1" stroke-dasharray="2 1" />
    <!-- 下唇轻抵上齿切缘 -->
    <path d="M 22 38 Q 32 37.5 42 37.8 Q 52 37.5 62 38 Q 52 46 42 46 Q 32 46 22 38 Z" fill="#FF8A9E" stroke="#E11D48" stroke-width="1.2" stroke-linejoin="round" />
    <text x="42" y="54" text-anchor="middle" font-size="7.5" fill="#64748B">上齿触下唇 · 狭缝摩擦</text>
  </g>

  <!-- 朝向提示 -->
  <g class="orientation-badge">
    <rect x="14" y="80" width="102" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="65" y="93.5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#475569">嘴巴侧面 · 脸朝右</text>
  </g>

  <!-- 顶部特性标签 -->
  <rect x="150" y="14" width="156" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
  <text x="228.0" y="25" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#3730A3">f · v · 唇齿摩擦音</text>

  <!-- 器官与气流标注 (引线与文字) -->
  <g class="organ-labels" font-family="system-ui, -apple-system, sans-serif">
    <!-- 软腭 -->
    <path d="M 134 66 L 134 78 L 142 98" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="142" cy="100" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="116" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="134" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">软腭</text>

    <!-- 硬腭 -->
    <path d="M 188 66 L 188 78 L 203 90" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="203" cy="92" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="170" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="188" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">硬腭</text>

    <!-- 咽部气道 -->
    <path d="M 60 168 L 123 168" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="125" cy="168" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="159" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="168" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">咽部</text>

    <!-- 舌头 (自然平放) -->
    <path d="M 60 216 L 124 216 L 185 168" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="187" cy="166" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="207" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">舌头</text>

    <!-- 上门牙 (绝对坐标 x=252, y=120) -->
    <path d="M 334 89 L 295 89 L 254 118" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="252" cy="120" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="80" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="89" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">上门牙</text>

    <!-- 摩擦位置 (橙色引线指向门牙与下唇狭缝：绝对坐标 x=256, y=136) -->
    <path d="M 326 113 L 288 113 L 258 135" fill="none" stroke="#EA580C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="256" cy="136" r="2.2" fill="#EA580C" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="326" y="104" width="56" height="18" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" />
    <text x="354" y="113" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#C2410C">摩擦位置</text>

    <!-- 下唇 (绝对坐标 x=276, y=144) -->
    <path d="M 334 137 L 304 137 L 278 144" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="276" cy="144" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="128" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="352" y="137" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">下唇</text>

    <!-- 呼气方向 (口外短虚线箭头指示呼气出口方向) -->
    <path d="M 322 161 L 330 161" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" />
    <rect x="330" y="152" width="56" height="18" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" />
    <text x="358" y="161" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#1D4ED8">呼气方向</text>

    <!-- 下门牙 (位于唇内后方：绝对坐标 x=246, y=160) -->
    <path d="M 334 185 L 285 185 L 248 160" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="246" cy="160" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="176" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="185" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">下门牙</text>

  </g>

  <!-- 发音口诀 -->
  <text x="200" y="260" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">上门牙轻触下唇内缘 · 狭缝摩擦 · f 清音 / v 浊音声带振动</text>

  <!-- 底部说明 -->
  <text x="200" y="284" text-anchor="middle" font-size="8.5" fill="#94A3B8">动作草图 · f/v 构音部位相同，声带振动状态不同 · 待专业审核</text>
</svg>