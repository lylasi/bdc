<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="h-title h-desc">
<title id="h-title">/h/ · 轻轻呼气</title><desc id="h-desc">示意口腔通道开放，不用舌头制造口腔摩擦。声门位于喉部，未在图中画出。口型及舌位随之后的元音变化，图中不是固定舌形。</desc>
