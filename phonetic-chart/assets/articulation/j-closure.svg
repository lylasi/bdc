<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-labelledby="voiced-ch-closure-title voiced-ch-closure-desc">
  <title id="voiced-ch-closure-title">塞擦音 /dʒ/ 发音示意 · ① 短暂闭塞阶段</title>
  <desc id="voiced-ch-closure-desc">侧面矢状面解剖示意：发塞擦音 /dʒ/ 的第①阶段（短暂闭塞）。舌尖与舌叶轻贴齿龈后部，彻底阻断口腔通路，软腭抬起闭合鼻腔，双唇微突，肺部呼出的气流在舌后受阻蓄压，暂无气流冲出口外。 此图展示 /dʒ/ 的口腔动作；浊音 · 振动时机随语境变化，声带未画出。</desc>
  <defs>
    <marker id="voiced-action-arrow-ch" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7C3AED" />
    </marker>
    <linearGradient id="voiced-palateGrad-ch-close" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EEE1" />
    </linearGradient>
    <linearGradient id="voiced-tongueGrad-ch-close" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
  </defs>

  <!-- 背景底卡 -->
  <rect width="400" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 主发音示意结构 (局部矢状面，脸朝右) -->
  <g class="diagram-figure" transform="translate(28, 18)">
    <!-- 后脑与面部外轮廓 (双唇微突) -->
    <path d="M 78 215 L 75 160 Q 75 105 115 48 Q 175 28 228 38 Q 252 58 260 74 Q 274 88 262 98 Q 262 106 274 114 Q 256 122 240 122" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />
    <path d="M 240 134 Q 262 140 258 148 Q 242 154 248 174 Q 234 195 226 215" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />

    <!-- 咽后壁解剖组织带 -->
    <path d="M 78 215 L 78 84 L 90 84 L 90 215 Z" fill="#F8F1E7" stroke="#E2D1BE" stroke-width="1.2" />

    <!-- 软腭与硬腭组织体 (浅米色解剖基底，软腭抬起封闭鼻咽) -->
    <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80 Q 175 74 214 96 L 222 102 L 226 95 Q 180 66 142 70 Q 110 73 90 75 Z" fill="url(#voiced-palateGrad-ch-close)" stroke="#D4BFA4" stroke-width="1.4" stroke-linejoin="round" />

    <!-- 硬腭表面轮廓线 -->
    <path d="M 142 80 Q 175 74 214 96" fill="none" stroke="#B89F82" stroke-width="1.8" stroke-linecap="round" />
    <!-- 软腭肌肉轮廓线 (抬起闭合) -->
    <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80" fill="none" stroke="#C27D88" stroke-width="1.8" stroke-linecap="round" />
    <line x1="142" y1="70" x2="142" y2="80" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />

    <!-- 鼻咽截断提示线 -->
    <path d="M 90 75 L 142 70 L 226 95" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3" />
    <text x="133" y="63" font-size="7" fill="#94A3B8" text-anchor="middle">鼻咽闭合 · 示意截断</text>

    <!-- 喉咽/气管入口底端截断 -->
    <line x1="90" y1="215" x2="118" y2="215" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
    <text x="104" y="223" font-size="7" fill="#64748B" text-anchor="middle">来自气管</text>

    <!-- 上门牙 -->
    <rect x="220" y="100" width="7.5" height="16" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />
    <!-- 下门牙 -->
    <rect x="219" y="132" width="7.5" height="15" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />

    <!-- 舌体 (粉色肌肉实体：舌尖与舌叶完全紧抵后齿龈与硬腭前端，形成完全密闭闭塞，无缝隙无自交) -->
    <path d="M 122 215 Q 126 168 134 140 Q 146 114 168 96 Q 186 90 206 92 L 220 96 L 220 114 Q 204 126 182 146 Q 162 168 154 215 Z" fill="url(#voiced-tongueGrad-ch-close)" stroke="#E11D48" stroke-width="1.8" stroke-linejoin="round" />
    <!-- 舌面高光弧线 -->
    <path d="M 157 110 Q 178 103 196 99" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <!-- 局部完全紧密闭塞接触面 (橙色加粗接触线，表示完全封死无通气) -->
    <path d="M 194 91 Q 206 93 218 96" fill="none" stroke="#EA580C" stroke-width="3.2" stroke-linecap="round" />

    <!-- 准备释放动作趋势箭头 (紫色虚线箭头，指示下一动作将向下拉开窄缝) -->
    <path d="M 204 102 L 204 116" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 2" marker-end="url(#voiced-action-arrow-ch)" />
  </g>

  <!-- 左上角：正面唇形小图标 -->
  <g class="lip-inset" transform="translate(14, 14)">
    <rect width="84" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="42" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">正面唇形</text>
    <ellipse cx="42" cy="34" rx="18" ry="10" fill="#FF8A9E" stroke="#E11D48" stroke-width="1.2" />
    <ellipse cx="42" cy="34" rx="10" ry="4" fill="#FFFFFF" stroke="#BE6476" stroke-width="0.8" />
    <text x="42" y="52" text-anchor="middle" font-size="8" fill="#64748B">① 轻贴闭塞 · 不出气</text>
  </g>

  <!-- 朝向提示 -->
  <g class="orientation-badge">
    <rect x="14" y="80" width="102" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="65" y="93.5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#475569">嘴巴侧面 · 脸朝右</text>
  </g>

  <!-- 顶部特性标签 -->
  <rect x="136" y="14" width="174" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
  <text x="223" y="25" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#3730A3">dʒ · ① 短暂闭塞 (先完全堵住)</text>

  <!-- 器官与气流标注 -->
  <g class="organ-labels" font-family="system-ui, -apple-system, sans-serif">
    <!-- 软腭 (指向闭合软腭：x=142, y=98) -->
    <path d="M 134 66 L 134 78 L 142 98" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="142" cy="100" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="116" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="134" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">软腭</text>

    <!-- 硬腭 (指向硬腭穹顶：x=203, y=92) -->
    <path d="M 188 66 L 188 78 L 203 90" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="203" cy="92" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="170" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="188" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">硬腭</text>

    <!-- 完全闭塞部位 (橙色引线指向舌叶与后齿龈完全闭塞接触面：x=234, y=108) -->
    <path d="M 326 95 L 280 95 L 234 108" fill="none" stroke="#EA580C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="234" cy="108" r="2.2" fill="#EA580C" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="326" y="86" width="66" height="18" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" />
    <text x="359" y="95" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="700" fill="#C2410C">齿龈后闭塞</text>

    <!-- 嘴唇微突 (指向微突双唇：x=298, y=132) -->
    <path d="M 334 140 L 305 140 L 298 132" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="298" cy="132" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="131" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="140" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">嘴唇微突</text>

    <!-- 舌头 (指向舌体中心：x=193, y=163) -->
    <path d="M 60 216 L 124 216 L 191 165" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="193" cy="163" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="207" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">舌头</text>

    <!-- 咽部气道 (x=125, y=168) -->
    <path d="M 60 168 L 123 168" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="125" cy="168" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="159" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="168" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">咽部</text>
  </g>

  <!-- 发音口诀 -->
  <text x="200" y="260" text-anchor="middle" font-size="9" font-weight="600" fill="#6D28D9">dʒ · 浊音 · 振动时机随语境变化（声带未画出）</text>

  <!-- 底部说明 -->
  <text x="200" y="284" text-anchor="middle" font-size="8.5" fill="#94A3B8">动作草图 · 塞擦音第①阶段：短暂闭塞 · 待专业审核</text>
</svg>
