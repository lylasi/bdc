<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-labelledby="w-title w-desc">
  <title id="w-title">圆唇软腭近音 /w/ 卡通发音示意</title>
  <desc id="w-desc">嘴巴侧面示意（脸朝右）：双唇向前收圆拢起，舌后部向软腭隆起抬高，形成前后两处近音收窄通道，气流通畅无摩擦；软腭抬起闭合；舌根后方咽腔通畅至底；口外蓝色虚线箭头指示呼气出口方向；声带振动。</desc>
  <defs>
    <marker id="arrow-w" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <linearGradient id="palateGrad-w" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EEE1" />
    </linearGradient>
    <linearGradient id="tongueGrad-w" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
  </defs>

  <!-- 背景底卡 -->
  <rect width="400" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 主发音示意结构 (局部矢状面，脸朝右) -->
  <g class="diagram-figure" transform="translate(28, 18)">

      <!-- 后脑与面部外轮廓 (面向右，双唇向前收圆拢起突出，无牙齿与唇接触) -->
      <path d="M 78 215 L 75 160 Q 75 105 115 48 Q 175 28 228 38 Q 252 58 260 74 Q 274 88 264 96 Q 268 104 278 108 Q 266 112 248 112" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />
      <!-- 下唇向前收圆突出 (与上唇形成小圆口裂) -->
      <path d="M 248 124 Q 274 124 272 130 Q 256 138 250 168 Q 236 195 226 215" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />

      <!-- 咽后壁解剖组织带 (后方封闭，腔面平顺垂直于 x=90，延伸至图底截断处) -->
      <path d="M 78 215 L 78 84 L 90 84 L 90 215 Z" fill="#F8F1E7" stroke="#E2D1BE" stroke-width="1.2" />

      <!-- 软腭与硬腭组织体 (硬腭在前、软腭在后) -->
      <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80 Q 175 74 214 96 L 222 102 L 226 95 Q 180 66 142 70 Q 110 73 90 75 Z" fill="url(#palateGrad-w)" stroke="#D4BFA4" stroke-width="1.4" stroke-linejoin="round" />

      <!-- 硬腭骨质穹顶表面轮廓线 -->
      <path d="M 142 80 Q 175 74 214 96" fill="none" stroke="#B89F82" stroke-width="1.8" stroke-linecap="round" />
      <!-- 软腭肌肉表面轮廓线 (呈抬起闭合状态) -->
      <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80" fill="none" stroke="#C27D88" stroke-width="1.8" stroke-linecap="round" />
      <!-- 软硬腭分界线 -->
      <line x1="142" y1="70" x2="142" y2="80" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- 鼻腔与颅底截断提示线 -->
      <path d="M 90 75 L 142 70 L 226 95" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3" />
      <text x="133" y="63" font-size="7" fill="#94A3B8" text-anchor="middle">鼻咽闭合 · 示意截断</text>

      <!-- 喉咽/气管入口底端截断 -->
      <line x1="90" y1="215" x2="118" y2="215" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
      <text x="104" y="223" font-size="7" fill="#64748B" text-anchor="middle">来自气管</text>

      <!-- 上门牙 (位于唇内，不与唇接触) -->
      <rect x="220" y="96" width="7.5" height="15" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />
      <!-- 下门牙 (位于唇内) -->
      <rect x="220" y="125" width="7.5" height="15" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />

      <!-- 舌体 (粉色肌肉实体：舌后部向软腭隆起抬高，舌前部放低，与软腭保留宽敞无摩擦近音通道) -->
      <path d="M 122 215 Q 124 155 132 126 Q 138 98 152 98 Q 170 108 190 126 Q 206 138 218 138 L 220 142 Q 210 152 188 160 Q 164 175 154 215 Z" fill="url(#tongueGrad-w)" stroke="#E11D48" stroke-width="1.8" stroke-linejoin="round" />
      <!-- 舌面高光弧线 (强调舌后部隆起) -->
      <path d="M 136 108 Q 152 102 174 116" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

      <!-- 软腭处近音收窄提示指示线 (示意无摩擦通道) -->
      <path d="M 144 86 L 148 94" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-dasharray="1.5 1.5" />

      <!-- 蓝箭头仅在口外指示呼气出口方向 -->
      <path d="M 272 127 L 295 127" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrow-w)" />

  </g>

  <!-- 左上角：正面唇形小图标 (紧密收圆拢唇正面观) -->
  <g class="lip-inset" transform="translate(14, 14)">
    <rect width="84" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="42" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">正面唇形</text>
    <!-- 外唇拢圆轮廓 (小圆唇) -->
    <ellipse cx="42" cy="35" rx="18" ry="12" fill="#FF8A9E" stroke="#E11D48" stroke-width="1.2" />
    <!-- 口裂中央小圆孔 -->
    <ellipse cx="42" cy="35" rx="7" ry="5.5" fill="#4C1D24" />
    <!-- 放射状收圆唇纹示意 -->
    <path d="M 26 35 L 32 35 M 58 35 L 52 35 M 42 25 L 42 29 M 42 45 L 42 41" stroke="#E11D48" stroke-width="0.8" stroke-linecap="round" />
    <text x="42" y="53" text-anchor="middle" font-size="7.5" fill="#64748B">收圆拢唇 · 微向前突</text>
  </g>

  <!-- 朝向提示 -->
  <g class="orientation-badge">
    <rect x="14" y="80" width="102" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="65" y="93.5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#475569">嘴巴侧面 · 脸朝右</text>
  </g>

  <!-- 顶部特性标签 -->
  <rect x="142" y="14" width="170" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
  <text x="227.0" y="25" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#3730A3">w · 圆唇软腭近音 (双重收窄)</text>

  <!-- 器官与气流标注 (引线与文字) -->
  <g class="organ-labels" font-family="system-ui, -apple-system, sans-serif">
    <!-- 软腭 -->
    <path d="M 134 66 L 134 78 L 142 98" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="142" cy="100" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="116" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="134" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">软腭</text>

    <!-- 硬腭 -->
    <path d="M 188 66 L 188 78 L 203 90" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="203" cy="92" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="170" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="188" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">硬腭</text>

    <!-- 咽部气道 -->
    <path d="M 60 168 L 123 168" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="125" cy="168" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="159" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="168" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">咽部</text>

    <!-- 舌头 -->
    <path d="M 60 216 L 124 216 L 176 172" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="178" cy="170" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="207" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">舌头</text>

    <!-- 舌后部抬高 (近音收窄点 B) -->
    <path d="M 230 66 L 205 66 L 178 114" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="178" cy="116" r="2.2" fill="#2563EB" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="230" y="57" width="68" height="18" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" />
    <text x="264" y="66" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#1D4ED8">舌后部抬高</text>

    <!-- 上门牙 -->
    <path d="M 334 100 L 295 100 L 254 114" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="252" cy="114" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="91" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="100" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">上门牙</text>

    <!-- 拢圆双唇 (近音收窄点 A) -->
    <path d="M 330 124 L 312 124 L 302 127" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="300" cy="127" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="330" y="115" width="56" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="358" y="124" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#334155">拢圆双唇</text>

    <!-- 呼气方向 (口外短虚线箭头指示呼气出口方向) -->
    <path d="M 324 145 L 330 145" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" />
    <rect x="330" y="136" width="56" height="18" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" />
    <text x="358" y="145" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#1D4ED8">呼气方向</text>

    <!-- 下门牙 -->
    <path d="M 334 169 L 292 169 L 254 152" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="252" cy="152" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="160" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="169" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">下门牙</text>

  </g>

  <!-- 发音口诀 -->
  <text x="200" y="260" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">双唇拢圆微突 · 舌后部向软腭抬起 · 两处收窄无摩擦 · 声带振动</text>

  <!-- 底部说明 -->
  <text x="200" y="284" text-anchor="middle" font-size="8.5" fill="#94A3B8">动作草图 · 双重近音构音 · 无牙齿与唇接触 · 待专业审核</text>
</svg>