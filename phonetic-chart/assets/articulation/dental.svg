<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-labelledby="dental-title dental-desc">
  <title id="dental-title">齿间/齿缘擦音 /θ, ð/ 卡通发音示意</title>
  <desc id="dental-desc">嘴巴侧面示意（脸朝右）：舌尖平缓伸向上门牙切缘，橙色细标示狭缝摩擦位置，绝不完全封死；舌根后方咽腔通畅至底；口外蓝色虚线箭头仅指示呼气出口方向。</desc>
  <defs>
    <marker id="arrow-dental" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563EB" />
    </marker>
    <marker id="action-arrow-dental" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7C3AED" />
    </marker>
    <linearGradient id="palateGrad-dental" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#F7EEE1" />
    </linearGradient>
    <linearGradient id="tongueGrad-dental" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA4B6" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
  </defs>

  <!-- 背景底卡 -->
  <rect width="400" height="300" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 主发音示意结构 (局部矢状面，脸朝右) -->
  <g class="diagram-figure" transform="translate(28, 18)">

      <!-- 后脑与面部外轮廓 (面向右，口裂真实开通，牙齿位于唇内) -->
      <path d="M 78 215 L 75 160 Q 75 105 115 48 Q 175 28 228 38 Q 252 58 260 74 Q 274 88 262 98 Q 260 106 268 114 Q 256 122 240 122" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />
      <path d="M 240 132 Q 258 138 254 144 Q 242 152 248 174 Q 234 195 226 215" fill="none" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round" />

      <!-- 咽后壁解剖组织带 (后方封闭，腔面平顺垂直于 x=90，延伸至图底截断处) -->
      <path d="M 78 215 L 78 84 L 90 84 L 90 215 Z" fill="#F8F1E7" stroke="#E2D1BE" stroke-width="1.2" />

      <!-- 软腭与硬腭组织体 (浅米色解剖基底，硬腭在前、软腭在后) -->
      <!-- 硬腭从门齿槽(222,102)到硬软腭交界(142,80)；软腭从(142,80)向后上方抬起并在(90,84)处贴合咽后壁闭锁鼻咽 -->
      <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80 Q 175 74 214 96 L 222 102 L 226 95 Q 180 66 142 70 Q 110 73 90 75 Z" fill="url(#palateGrad-dental)" stroke="#D4BFA4" stroke-width="1.4" stroke-linejoin="round" />

      <!-- 硬腭骨质穹顶表面轮廓线 (前上方) -->
      <path d="M 142 80 Q 175 74 214 96" fill="none" stroke="#B89F82" stroke-width="1.8" stroke-linecap="round" />
      <!-- 软腭肌肉表面轮廓线 (后上方，呈抬起闭合状态) -->
      <path d="M 90 84 Q 92 86 102 85 Q 120 82 142 80" fill="none" stroke="#C27D88" stroke-width="1.8" stroke-linecap="round" />
      <!-- 软硬腭解剖分界细标记线 -->
      <line x1="142" y1="70" x2="142" y2="80" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2" />

      <!-- 鼻腔与颅底截断提示线 (示意裁剪，非通气道) -->
      <path d="M 90 75 L 142 70 L 226 95" fill="none" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3 3" />
      <text x="133" y="63" font-size="7" fill="#94A3B8" text-anchor="middle">鼻咽闭合 · 示意截断</text>

      <!-- 喉咽/气管入口底端截断 (y=215，咽后壁90与舌根间留出宽敞气道) -->
      <line x1="90" y1="215" x2="118" y2="215" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
      <text x="104" y="223" font-size="7" fill="#64748B" text-anchor="middle">来自气管</text>

      <!-- 上门牙 (牙白，嵌在唇内) -->
      <rect x="220" y="100" width="7.5" height="16" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />
      <!-- 下门牙 (牙白，随开口度自如开合) -->
      <rect x="220" y="132" width="7.5" height="15" rx="1.5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.3" />

      <!-- 舌体 (粉色肌肉实体，舌根后方有连续咽腔通气道至图底，绝不与咽后壁焊死) -->
      <path d="M 122 215 Q 124 165 132 142 Q 146 130 170 126 Q 195 124 218 122 L 227 122 Q 225 128 221 133 L 216 134 Q 206 146 182 156 Q 160 175 154 215 Z" fill="url(#tongueGrad-dental)" stroke="#E11D48" stroke-width="1.8" stroke-linejoin="round" />
      <!-- 舌面高光弧线 -->
      <path d="M 154 130 Q 182 126 210 125" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />

      <!-- 局部细橙色狭缝摩擦标记 (齿间极窄气流狭缝，不完全封死) -->
      <path d="M 221 117 Q 225 120 228 122" fill="none" stroke="#EA580C" stroke-width="2" stroke-linecap="round" />

      <!-- 蓝箭头仅在口外指示呼气出口方向，不穿牙、不穿腔 -->
      <path d="M 272 143 L 296 143" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#arrow-dental)" />

  </g>

  <!-- 左上角：正面唇形小图标 (齿间真实显露门牙与舌尖) -->
  <g class="lip-inset" transform="translate(14, 14)">
    <rect width="84" height="60" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2" />
    <text x="42" y="15" text-anchor="middle" font-size="9" font-weight="700" fill="#475569">正面唇形</text>
    <!-- 外唇轮廓 -->
    <path d="M 20 35 Q 31 28 42 29 Q 53 28 64 35 Q 53 42 42 42 Q 31 42 20 35 Z" fill="#FF8A9E" stroke="#E11D48" stroke-width="1.2" stroke-linejoin="round" />
    <!-- 口裂内暗色背景 -->
    <path d="M 26 35 Q 34 30.5 42 31 Q 50 30.5 58 35 Q 50 39.5 42 39 Q 34 39.5 26 35 Z" fill="#4C1D24" />
    <!-- 白色上门牙 -->
    <path d="M 32 31.5 L 32 34.2 Q 42 34.6 52 34.2 L 52 31.5 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.6" />
    <line x1="42" y1="31.2" x2="42" y2="34.4" stroke="#CBD5E1" stroke-width="0.6" />
    <!-- 白色下门牙 -->
    <path d="M 33 38.5 L 33 36.2 Q 42 35.8 51 36.2 L 51 38.5 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.6" />
    <line x1="42" y1="36.0" x2="42" y2="38.7" stroke="#CBD5E1" stroke-width="0.6" />
    <!-- 粉色舌尖在上下齿缝中可见 -->
    <path d="M 35 35.2 Q 42 33.6 49 35.2 Q 42 36.8 35 35.2 Z" fill="#FFA4B6" stroke="#E11D48" stroke-width="0.7" />
    <text x="42" y="52" text-anchor="middle" font-size="8" fill="#64748B">平展 · 齿间露舌尖</text>
  </g>

  <!-- 朝向提示 -->
  <g class="orientation-badge">
    <rect x="14" y="80" width="102" height="20" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
    <text x="65" y="93.5" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="600" fill="#475569">嘴巴侧面 · 脸朝右</text>
  </g>

  <!-- 顶部特性标签 -->
  <rect x="156" y="14" width="144" height="22" rx="11" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
  <text x="228.0" y="25" text-anchor="middle" dominant-baseline="central" font-size="10" font-weight="700" fill="#3730A3">θ · ð · 齿间摩擦音</text>

  <!-- 器官与气流标注 (引线与文字) -->
  <g class="organ-labels" font-family="system-ui, -apple-system, sans-serif">
    <!-- 软腭 (指向后上方抬起闭合部位：绝对坐标 x=142, y=102 -> 局部 x=114, y=84) -->
    <path d="M 134 66 L 134 78 L 142 98" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="142" cy="100" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="116" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="134" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">软腭</text>

    <!-- 硬腭 (指向前上方骨性穹顶：绝对坐标 x=203, y=92 -> 局部 x=175, y=74) -->
    <path d="M 188 66 L 188 78 L 203 90" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="203" cy="92" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="170" y="48" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="188" y="57" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">硬腭</text>

    <!-- 咽部气道 (指向咽腔通气空隙中央：绝对坐标 x=125, y=168 -> 局部 x=97, y=150，后壁90与舌根间纯空气通道) -->
    <path d="M 60 168 L 123 168" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="125" cy="168" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="159" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="168" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">咽部</text>

    <!-- 舌头 (指向粉色舌体内部中心丰满处：绝对坐标 x=193, y=163 -> 局部 x=165, y=145，实心粉色肌体内) -->
    <path d="M 60 216 L 124 216 L 191 165" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="193" cy="163" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="24" y="207" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="42" y="216" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">舌头</text>

    <!-- 上门牙 (绝对坐标 x=252, y=120) -->
    <path d="M 334 89 L 295 89 L 254 118" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="252" cy="120" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="80" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="89" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">上门牙</text>

    <!-- 摩擦位置 (橙色引线指向齿间狭缝：绝对坐标 x=254, y=138) -->
    <path d="M 326 113 L 288 113 L 256 136" fill="none" stroke="#EA580C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="254" cy="138" r="2.2" fill="#EA580C" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="326" y="104" width="56" height="18" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="0.8" />
    <text x="354" y="113" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#C2410C">摩擦位置</text>

    <!-- 嘴唇 (绝对坐标 x=296, y=132) -->
    <path d="M 334 137 L 308 137 L 296 132" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="296" cy="132" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="128" width="36" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="352" y="137" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">嘴唇</text>

    <!-- 呼气方向 (口外短虚线箭头指示呼气出口方向) -->
    <path d="M 322 161 L 330 161" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" />
    <rect x="330" y="152" width="56" height="18" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8" />
    <text x="358" y="161" text-anchor="middle" dominant-baseline="central" font-size="9" font-weight="700" fill="#1D4ED8">呼气方向</text>

    <!-- 下门牙 (指向下门牙中心：绝对坐标 x=252, y=158) -->
    <path d="M 334 185 L 292 185 L 254 160" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="252" cy="158" r="2.2" fill="#475569" stroke="#FFFFFF" stroke-width="0.8" />
    <rect x="334" y="176" width="46" height="18" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="0.8" />
    <text x="357" y="185" text-anchor="middle" dominant-baseline="central" font-size="9.5" font-weight="600" fill="#334155">下门牙</text>

  </g>

  <!-- 发音口诀 -->
  <text x="200" y="260" text-anchor="middle" font-size="9" font-weight="600" fill="#475569">齿间留极窄狭缝 · 摩擦发音 · 外箭头示呼气出口</text>

  <!-- 底部说明 -->
  <text x="200" y="284" text-anchor="middle" font-size="8.5" fill="#94A3B8">动作草图 · 清浊齿擦音同位 · 齿间留摩擦狭缝 · 待专业审核</text>
</svg>