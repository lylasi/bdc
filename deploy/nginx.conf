server {
    listen 80;
    server_name _;
    root /srv/bdc;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    location = /ai-config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~* (^|/)(docs|scripts|tests|selfhost|cloudflare-worker|article-import-service|node_modules|deploy)(/|$) {
        return 404;
    }

    location ~* (\.(md|markdown|map)|/test-[^/]*\.html|/ai-config\.example\.js)$ {
        return 404;
    }

    # 只設定此 location 的後備 MIME，保留官方完整 mime.types。
    location ~* \.mjs$ {
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
