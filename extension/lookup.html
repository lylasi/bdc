<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="extension.title"></title>
    <link rel="stylesheet" href="./lookup.css" />
</head>
<body>
    <div id="ext-inline-toolbar" hidden>
        <strong class="ext-toolbar-title" data-i18n="extension.inlineTitle"></strong>
        <div class="ext-toolbar-actions">
            <button id="ext-inline-more" type="button" class="ext-btn ext-btn-quiet ext-btn-sm" data-i18n="extension.inlineMore"></button>
            <button id="ext-inline-back" type="button" class="ext-btn ext-btn-quiet ext-btn-sm" hidden data-i18n="extension.inlineBack"></button>
            <button id="ext-inline-edit" type="button" class="ext-btn ext-btn-quiet ext-btn-sm" data-i18n="extension.inlineEdit"></button>
            <button id="ext-inline-settings" type="button" class="ext-btn ext-btn-quiet ext-btn-sm" data-i18n="extension.inlineSettings"></button>
            <button id="ext-inline-close" type="button" class="ext-btn ext-btn-quiet ext-btn-sm ext-btn-close" data-i18n="extension.inlineClose"></button>
        </div>
    </div>

    <p id="ext-inline-status" class="ext-notice ext-notice-info" hidden></p>
    <p id="ext-inline-action-notice" class="ext-notice ext-notice-error" role="status" hidden></p>

    <div id="ext-inline-confirm" role="alertdialog" aria-modal="true" aria-labelledby="ext-inline-confirm-title" hidden>
        <strong id="ext-inline-confirm-title" class="ext-confirm-title" data-i18n="extension.inlineUnsavedTitle"></strong>
        <p id="ext-inline-confirm-text" class="ext-confirm-text"></p>
        <div class="ext-row">
            <button id="ext-inline-keep" type="button" class="ext-btn ext-btn-primary" data-i18n="extension.inlineKeepEditing"></button>
            <button id="ext-inline-discard" type="button" class="ext-btn" data-i18n="extension.inlineDiscardClose"></button>
        </div>
    </div>

    <header class="ext-header" id="ext-header">
        <div class="ext-header-text">
            <h1 class="ext-title" id="ext-title" data-i18n="extension.title"></h1>
            <p class="ext-subtitle" id="ext-subtitle" data-i18n="extension.subtitle"></p>
        </div>
        <div class="ext-header-controls">
            <label for="ext-locale-select" class="ext-visually-hidden" data-i18n="extension.localeLabel"></label>
            <select id="ext-locale-select" class="ext-select ext-select-sm" data-i18n-aria-label="extension.localeLabel">
                <option value="zh-CN" data-i18n="extension.localeZhCN"></option>
                <option value="zh-HK" data-i18n="extension.localeZhHK"></option>
            </select>
            <button type="button" id="ext-open-tab-btn" class="ext-btn ext-btn-quiet ext-btn-sm" data-i18n="extension.openStandaloneBtn" data-i18n-title="extension.openStandaloneBtn"></button>
        </div>
    </header>

    <section class="ext-section" id="ext-account-section" aria-labelledby="ext-account-heading">
        <details id="ext-account-details" class="ext-disclosure ext-disclosure-block" open>
            <summary id="ext-account-summary" class="ext-disclosure-summary">
                <h2 class="ext-disclosure-title" id="ext-account-heading" data-i18n="extension.accountSectionTitle"></h2>
                <span id="ext-account-status" class="ext-chip"></span>
            </summary>
            <div class="ext-disclosure-body">
                <div class="ext-field">
                    <label for="ext-endpoint-input" data-i18n="extension.endpointLabel"></label>
                    <input type="url" id="ext-endpoint-input" data-i18n-placeholder="extension.endpointPlaceholder" autocomplete="off" />
                </div>
                <div class="ext-field">
                    <label for="ext-app-url" data-i18n="extension.appUrlLabel"></label>
                    <input type="url" id="ext-app-url" placeholder="https://your-bdc.example/" autocomplete="off" />
                </div>
                <div class="ext-field">
                    <label for="ext-login-mode" data-i18n="extension.loginModeLabel"></label>
                    <select id="ext-login-mode" data-i18n-aria-label="extension.loginModeLabel">
                        <option value="password" data-i18n="extension.loginModePassword"></option>
                        <option value="token" data-i18n="extension.loginModeToken"></option>
                        <option value="code" data-i18n="extension.loginModeCode"></option>
                    </select>
                </div>

                <div id="ext-mode-password-fields">
                    <div class="ext-field">
                        <label for="ext-username-input" data-i18n="extension.usernameLabel"></label>
                        <input type="text" id="ext-username-input" data-i18n-placeholder="extension.usernamePlaceholder" autocomplete="username" />
                    </div>
                    <div class="ext-field">
                        <label for="ext-password-input" data-i18n="extension.passwordLabel"></label>
                        <input type="password" id="ext-password-input" data-i18n-placeholder="extension.passwordPlaceholder" autocomplete="current-password" />
                    </div>
                </div>

                <div id="ext-mode-token-fields" class="hidden">
                    <div class="ext-field">
                        <label for="ext-token-input" data-i18n="extension.tokenLabel"></label>
                        <input type="password" id="ext-token-input" data-i18n-placeholder="extension.tokenPlaceholder" autocomplete="off" />
                    </div>
                </div>

                <div id="ext-mode-code-fields" class="hidden">
                    <div class="ext-field">
                        <label for="ext-code-input" data-i18n="extension.loginCodeLabel"></label>
                        <input type="text" id="ext-code-input" data-i18n-placeholder="extension.loginCodePlaceholder" autocomplete="off" />
                    </div>
                </div>

                <div class="ext-row ext-row-actions">
                    <button type="button" id="ext-connect-btn" class="ext-btn ext-btn-primary" data-i18n="extension.connectBtn"></button>
                    <button type="button" id="ext-sync-btn" class="ext-btn" data-i18n="extension.syncBtn"></button>
                    <button type="button" id="ext-logout-btn" class="ext-btn" data-i18n="extension.logoutBtn"></button>
                    <button type="button" id="ext-enable-inline" class="ext-btn" data-i18n="extension.inlineEnable"></button>
                </div>

                <div class="ext-status-list" id="ext-readiness-box" aria-live="polite">
                    <div class="ext-status-line" id="ext-catalog-status"></div>
                    <div class="ext-status-line" id="ext-task-status"></div>
                </div>
            </div>
        </details>

        <div id="ext-account-notice" class="ext-notice hidden" role="status" aria-live="polite"></div>

        <div id="ext-missing-key-banner" class="ext-banner-warning hidden" role="region" data-i18n-aria-label="extension.missingKeyBannerTitle">
            <h4 id="ext-missing-key-title" class="ext-banner-title" data-i18n="extension.missingKeyBannerTitle"></h4>
            <p id="ext-missing-key-desc" class="ext-banner-text"></p>
            <div class="ext-field">
                <label for="ext-import-provider-select" data-i18n="extension.importKeyProviderLabel"></label>
                <select id="ext-import-provider-select" data-i18n-aria-label="extension.importKeyProviderLabel"></select>
            </div>
            <div class="ext-field">
                <label for="ext-import-key-input" data-i18n="extension.importKeyInputLabel"></label>
                <input type="password" id="ext-import-key-input" data-i18n-placeholder="extension.importKeyPlaceholder" autocomplete="off" />
            </div>
            <button type="button" id="ext-import-key-btn" class="ext-btn" data-i18n="extension.importKeyBtn"></button>
        </div>
    </section>

    <section class="ext-section" id="ext-lookup-section" aria-labelledby="ext-lookup-heading">
        <div class="ext-section-head">
            <h2 class="ext-section-title" id="ext-lookup-heading" data-i18n="extension.lookupSectionTitle"></h2>
            <button type="button" id="ext-extract-btn" class="ext-btn ext-btn-quiet ext-btn-sm" data-i18n="extension.extractFromTabBtn"></button>
        </div>

        <div class="ext-field ext-field-word">
            <label for="ext-word-input" data-i18n="extension.wordLabel"></label>
            <input type="text" id="ext-word-input" data-i18n-placeholder="extension.wordPlaceholder" />
        </div>

        <details id="ext-query-details" class="ext-disclosure ext-disclosure-quiet" open>
            <summary id="ext-query-summary" class="ext-disclosure-summary">
                <span class="ext-disclosure-title" data-i18n="extension.sentenceLabel"></span>
            </summary>
            <div class="ext-disclosure-body">
                <div class="ext-field">
                    <textarea id="ext-sentence-input" rows="2" data-i18n-placeholder="extension.sentencePlaceholder" data-i18n-aria-label="extension.sentenceLabel"></textarea>
                </div>
                <div class="ext-field">
                    <label for="ext-context-input" data-i18n="extension.contextLabel"></label>
                    <textarea id="ext-context-input" rows="2" data-i18n-placeholder="extension.contextPlaceholder"></textarea>
                </div>
            </div>
        </details>

        <div class="ext-row ext-row-submit" id="ext-force-row">
            <label class="ext-check">
                <input type="checkbox" id="ext-force-refresh" />
                <span data-i18n="extension.forceRefreshLabel"></span>
            </label>
            <button type="button" id="ext-lookup-btn" class="ext-btn ext-btn-primary" data-i18n="extension.lookupBtn"></button>
        </div>

        <div id="ext-lookup-notice" class="ext-notice hidden" role="alert" aria-live="assertive"></div>
    </section>

    <section id="ext-result-section" class="ext-section ext-section-result" aria-labelledby="ext-result-heading">
        <h2 class="ext-section-title" id="ext-result-heading" data-i18n="extension.resultSectionTitle"></h2>
        <div id="ext-result-empty" class="ext-hint" data-i18n="extension.resultEmpty"></div>
        <div id="ext-inline-lookup-notice" class="ext-notice" role="alert" aria-live="assertive" hidden></div>
        <div id="ext-result-box" class="ext-result-box hidden" aria-live="polite">
            <div class="ext-result-head">
                <span class="ext-result-word" id="ext-result-word"></span>
                <span class="ext-result-phonetic" id="ext-result-phonetic"></span>
                <span class="ext-result-pos" id="ext-result-pos"></span>
            </div>
            <div class="ext-result-meaning" id="ext-result-meaning"></div>
            <div class="ext-result-role" id="ext-result-role"></div>
            <details id="ext-result-details" class="ext-disclosure ext-disclosure-quiet ext-result-extra">
                <summary class="ext-disclosure-summary">
                    <span class="ext-disclosure-title" data-i18n="extension.resultExamplesLabel"></span>
                </summary>
                <div class="ext-disclosure-body">
                    <ul id="ext-result-examples" class="ext-result-examples"></ul>
                </div>
            </details>
            <div class="ext-result-meta" id="ext-result-meta"></div>
        </div>
        <button id="ext-inline-retry" type="button" class="ext-btn ext-btn-sm" hidden data-i18n="extension.inlineRetry"></button>
    </section>

    <section id="ext-capture-section" class="ext-section" aria-labelledby="ext-capture-heading">
        <h2 class="ext-section-title" id="ext-capture-heading" data-i18n="extension.captureTitle"></h2>
        <div class="ext-field ext-field-book">
            <label for="ext-capture-book" data-i18n="extension.captureBookLabel"></label>
            <select id="ext-capture-book" data-i18n-aria-label="extension.captureBookLabel"></select>
        </div>
        <p id="ext-capture-source" class="ext-source"></p>
        <p id="ext-capture-hint" class="ext-hint" data-i18n="extension.captureHint"></p>
        <div class="ext-row ext-row-actions">
            <button type="button" id="ext-capture-save" class="ext-btn ext-btn-primary" disabled data-i18n="extension.captureSave"></button>
            <button id="ext-quick-capture" type="button" class="ext-btn ext-btn-primary" hidden data-i18n="extension.inlineCreateAndCapture"></button>
            <button type="button" id="ext-capture-refresh" class="ext-btn" data-i18n="extension.captureRefresh"></button>
        </div>
        <div id="ext-capture-notice" class="ext-notice" role="status" aria-live="polite" hidden></div>
        <div class="ext-row ext-row-actions ext-book-actions">
            <button id="ext-book-page" type="button" class="ext-btn ext-btn-sm" data-i18n="extension.bookCreatePage"></button>
            <button id="ext-book-new" type="button" class="ext-btn ext-btn-sm" data-i18n="extension.bookCreate"></button>
            <button id="ext-book-default-create" type="button" class="ext-btn ext-btn-sm" data-i18n="extension.bookCreateDefault"></button>
            <button id="ext-book-set-default" type="button" class="ext-btn ext-btn-sm" data-i18n="extension.bookSetDefault"></button>
        </div>
        <div id="ext-book-form" class="ext-book-form" hidden>
            <div class="ext-field">
                <label for="ext-book-name" data-i18n="extension.bookName"></label>
                <input id="ext-book-name" type="text" maxlength="300" data-i18n-placeholder="extension.bookNamePlaceholder" />
            </div>
            <label class="ext-check"><input id="ext-book-link-page" type="checkbox" checked /><span data-i18n="extension.bookLinkPage"></span></label>
            <label class="ext-check"><input id="ext-book-make-default" type="checkbox" /><span data-i18n="extension.bookMakeDefault"></span></label>
            <button id="ext-book-submit" type="button" class="ext-btn ext-btn-primary ext-btn-sm" data-i18n="extension.bookCreate"></button>
        </div>
        <details id="ext-capture-pending" class="ext-disclosure ext-disclosure-quiet ext-pending" hidden>
            <summary id="ext-capture-pending-summary" class="ext-disclosure-summary"></summary>
            <div class="ext-disclosure-body">
                <p class="ext-hint" data-i18n="extension.capturePendingHint"></p>
                <ul id="ext-capture-pending-list" class="ext-pending-list"></ul>
            </div>
        </details>
    </section>

    <section id="ext-page-article-section" class="ext-section" aria-labelledby="ext-page-article-heading">
        <div class="ext-section-head">
            <h2 id="ext-page-article-heading" class="ext-section-title" data-i18n="extension.pageArticleTitle"></h2>
            <button id="ext-article-cancel" type="button" class="ext-btn ext-btn-sm" hidden data-i18n="extension.pageArticleCancel"></button>
            <button id="ext-article-open" type="button" class="ext-btn ext-btn-sm" hidden data-i18n="extension.pageArticleOpen"></button>
        </div>
        <p class="ext-hint" data-i18n="extension.pageArticleHint"></p>
        <div class="ext-row ext-row-actions">
            <button id="ext-article-extract" type="button" class="ext-btn" data-i18n="extension.pageArticleExtract"></button>
        </div>
        <div id="ext-article-preview" class="ext-preview" hidden>
            <div class="ext-field">
                <label for="ext-article-title" data-i18n="extension.pageArticleTitleLabel"></label>
                <input id="ext-article-title" type="text" maxlength="300" />
            </div>
            <div class="ext-field">
                <label for="ext-article-body" data-i18n="extension.pageArticleBodyLabel"></label>
                <textarea id="ext-article-body" rows="8"></textarea>
            </div>
            <label class="ext-check"><input id="ext-article-analyze" type="checkbox" /><span data-i18n="extension.pageArticleAnalyze"></span></label>
            <button id="ext-article-save" type="button" class="ext-btn ext-btn-primary" data-i18n="extension.pageArticleSave"></button>
        </div>
        <p id="ext-workspace-notice" class="ext-notice" role="status" aria-live="polite" hidden></p>
        <details id="ext-workspace-pending" class="ext-disclosure ext-disclosure-quiet ext-pending" hidden>
            <summary class="ext-disclosure-summary"><span class="ext-disclosure-title" data-i18n="extension.workspacePending"></span></summary>
            <div class="ext-disclosure-body">
                <p class="ext-hint" data-i18n="extension.workspacePendingHint"></p>
                <ul id="ext-workspace-pending-list" class="ext-pending-list"></ul>
            </div>
        </details>
    </section>

    <script type="module" src="./lookup.js"></script>
</body>
</html>
